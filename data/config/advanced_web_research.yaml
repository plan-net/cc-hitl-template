# Ray Serve configuration for Advanced Web Research Agent
# Deploy with: serve deploy data/config/advanced_web_research.yaml

# HTTP options
http_options:
  host: 0.0.0.0
  port: 8000

# Applications to deploy
applications:
  - name: advanced_web_research
    route_prefix: /research
    import_path: advanced_web_research.query:fast_app

    # Runtime environment configuration
    runtime_env:
      env_vars:
        # Claude API key - REQUIRED
        # Copy the EXACT literal value from ANTHROPIC_API_KEY in .env
        ANTHROPIC_API_KEY: "sk-ant-...copy-your-actual-key-from-env-file..."

        # Note: EXA_API_KEY is hardcoded in SKILL.md
        # Note: Langfuse credentials are hardcoded in SKILL.md

    # Deployment options
    deployments:
      - name: AdvancedWebResearch
        num_replicas: 1
        max_ongoing_requests: 10
