# Ray Serve configuration for Advanced Web Research Agent
# Deploy with: serve deploy data/config/advanced_web_research.yaml

# HTTP options
http_options:
  host: 0.0.0.0
  port: 8000

# Applications to deploy
applications:
  - name: advanced_web_research
    route_prefix: /research
    import_path: advanced_web_research.query:fast_app

    # Runtime environment configuration
    # Note: For local development, Claude SDK uses CLI auth (via `claude login`)
    # For production with containers, set ANTHROPIC_API_KEY in runtime_env
    # runtime_env:
    #   env_vars:
    #     ANTHROPIC_API_KEY: "sk-ant-your-actual-key-here"

    # Deployment options
    deployments:
      - name: AdvancedWebResearch
        num_replicas: 1
        max_ongoing_requests: 10
